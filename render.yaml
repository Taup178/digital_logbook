services:
  # ==============================
  # FRONTEND
  # ==============================
  - type: web
    name: digital-logbook
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      - key: VITE_AUTH_SERVICE_URL
        sync: false

      - key: VITE_PROFILE_SERVICE_URL
        sync: false

      - key: VITE_DASHBOARD_SERVICE_URL
        sync: false

      - key: VITE_PROJECT_SERVICE_URL
        sync: false


  # ==============================
  # AUTH SERVICE
  # ==============================
  - type: web
    name: auth-service
    runtime: node
    plan: free
    rootDir: services/auth-service

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PORT
        value: 5001


  # ==============================
  # DASHBOARD SERVICE
  # ==============================
  - type: web
    name: dashboard-service
    runtime: node
    plan: free
    rootDir: services/dashboard-service

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PORT
        value: 5002

      - key: DATABASE_URL
        sync: false


  # ==============================
  # PROJECT SERVICE
  # ==============================
  - type: web
    name: project-service
    runtime: node
    plan: free
    rootDir: services/project-service

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PORT
        value: 5003

      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false


  # ==============================
  # API GATEWAY
  # ==============================
  - type: web
    name: api-gateway
    runtime: node
    plan: free
    rootDir: api-gateway

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PORT
        value: 5050

      - key: AUTH_SERVICE_URL
        sync: false

      - key: DASHBOARD_SERVICE_URL
        sync: false

      - key: PROJECT_SERVICE_URL
        sync: false

      - key: PROFILE_SERVICE_URL
        sync: false


  # ==============================
  # PROFILE SERVICE
  # ==============================
  - type: web
    name: profile-service
    runtime: node
    plan: free
    rootDir: services/profile-service

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PORT
        value: 5004

      - key: DATABASE_URL
        sync: false
