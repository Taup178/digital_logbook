services:
  - type: web
    name: auth-service
    runtime: node
    plan: free
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001

  - type: web
    name: dashboard-service
    runtime: node
    plan: free
    rootDir: services/dashboard-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5002
      - key: DATABASE_URL
        sync: false

  - type: web
    name: project-service
    runtime: node
    plan: free
    rootDir: services/project-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5003
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false

  - type: web
    name: profile-service
    runtime: node
    plan: free
    rootDir: services/profile-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5004
      - key: DATABASE_URL
        sync: false

  - type: web
    name: api-gateway
    runtime: node
    plan: free
    rootDir: api-gateway
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5050
      - key: AUTH_SERVICE_URL
        sync: false
      - key: DASHBOARD_SERVICE_URL
        sync: false
      - key: PROJECT_SERVICE_URL
        sync: false
      - key: PROFILE_SERVICE_URL
        sync: false
