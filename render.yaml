services:
  - type: web
    name: digital-logbook
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AUTH_SERVICE_URL
        sync: false
      - key: VITE_PROFILE_SERVICE_URL
        sync: false
      - key: VITE_DASHBOARD_SERVICE_URL
        sync: false
      - key: VITE_PROJECT_SERVICE_URL
        sync: false

  - type: web
    name: auth-service
    env: node
    plan: free
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001

  - type: web
    name: dashboard-service
    env: node
    plan: free
    rootDir: services/dashboard-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5002
      - key: DATABASE_URL
        sync: false

  - type: web
    name: project-service
    env: node
    plan: free
    rootDir: services/project-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5003
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false

  - type: web
    name: api-gateway
    env: node
    plan: free
    rootDir: api-gateway
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5050
      - key: AUTH_SERVICE_URL
        sync: false
      - key: DASHBOARD_SERVICE_URL
        sync: false
      - key: PROJECT_SERVICE_URL
        sync: false
      - key: PROFILE_SERVICE_URL
        sync: false

  - type: web
    name: profile-service
    env: node
    plan: free
    rootDir: services/profile-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5004
      - key: DATABASE_URL
        sync: false
