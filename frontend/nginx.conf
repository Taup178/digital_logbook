server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # If a requested file is not found, serve index.html for SPA routing
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        internal;
    }
}
